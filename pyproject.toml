[project]
name = "rag"
version = "0.1.0"
description = "Agentic RAG system built on a private Obsidian vault"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "litellm>=1.50",
    "ragas>=0.2,<0.4",
    "structlog>=24.4",
    "typer>=0.13",
    "sentence-transformers>=3.0",
    "baml-py>=0.223",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
# ragas 0.3.x imports langchain_community.chat_models.vertexai, which was
# removed in langchain-community 0.4.0 — pin below that until ragas drops it.
constraint-dependencies = ["langchain-community<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/rag/agent/baml_client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
# E/F = pycodestyle + pyflakes
# I   = isort
# UP  = pyupgrade (enforces new-style types: X | Y, list[X], type alias syntax)
# B   = bugbear
# SIM = simplify
# TCH = type-checking imports

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["src/rag/agent/baml_client/"]

# tokenizers ships no py.typed marker / stubs upstream — nothing to fix on our side.
[[tool.mypy.overrides]]
module = "tokenizers"
ignore_missing_imports = true

# baml_client is generated code (excluded above), but other modules still import
# it directly — its own type errors should not surface to those call sites.
[[tool.mypy.overrides]]
module = "rag.agent.baml_client.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that call external APIs (deselect with -m 'not integration')",
]
