name: Eval gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: "postgresql+asyncpg://rag:test@localhost:5432/rag_db"
      LITELLM_BASE_URL: "http://localhost:4000"
      LITELLM_MASTER_KEY: "sk-litellm-ci"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -U rag -d rag_db -f docker/postgres/init.sql

      # services: cannot mount config files, so the LiteLLM proxy (which needs
      # docker/litellm/config.yaml for its model_list/aliases) is started as a
      # plain docker run with the repo checkout bind-mounted, instead.
      - name: Start LiteLLM proxy
        run: |
          docker run -d --name litellm \
            --network host \
            -v "${{ github.workspace }}/docker/litellm/config.yaml:/app/config.yaml" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e LITELLM_MASTER_KEY="sk-litellm-ci" \
            ghcr.io/berriai/litellm:main-latest \
            --config /app/config.yaml --port 4000
          timeout 60 bash -c 'until curl -sf http://localhost:4000/health/liveliness; do sleep 2; done'

      - name: Run ingestion
        run: uv run python -m rag.ingestion.pipeline

      # Thresholds and regression tolerance deliberately come from config.py defaults —
      # duplicating them as env vars here created a second source of truth that could
      # silently drift from what `make eval` uses locally.
      #
      # Two gates, one golden dataset (see ADR-006, "Two eval levels"):
      #   - test_golden_dataset.py       — component gate: retrieval + bare synthesis
      #   - test_agent_golden_dataset.py — end-to-end gate: the actual ReAct agent
      # Each keeps its own baseline file; the score distributions are not comparable.
      - name: Run RAGAS eval gates (component + end-to-end agent)
        run: >
          uv run pytest -m integration -v
          tests/evals/test_golden_dataset.py
          tests/evals/test_agent_golden_dataset.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            data/baseline_scores.json
            data/agent_baseline_scores.json
          if-no-files-found: warn

      # save_baseline_scores() (rag/evals/dataset.py) only rewrites these files locally
      # in the runner's checkout, and only when every metric passed — see ADR-001
      # addendum. Without this step the updated files never leave the runner, so the
      # baselines on `main` would never actually advance after a passing PR despite the
      # ADR's "baseline only advances when a run passes" claim. Committing back to the
      # PR branch (not `main` directly) keeps the update visible in the PR diff for
      # review instead of silently mutating `main` out-of-band.
      - name: Commit updated baselines if they advanced
        if: always()
        run: |
          git add -- data/baseline_scores.json
          # The agent baseline does not exist until its first passing run.
          if [ -f data/agent_baseline_scores.json ]; then
            git add -- data/agent_baseline_scores.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update eval baseline scores [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No baseline change to commit."
          fi
