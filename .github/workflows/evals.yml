name: Eval gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: "postgresql+asyncpg://rag:test@localhost:5432/rag_db"
      LITELLM_BASE_URL: "http://localhost:4000"
      LITELLM_MASTER_KEY: "sk-litellm-ci"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -U rag -d rag_db -f docker/postgres/init.sql

      # services: cannot mount config files, so the LiteLLM proxy (which needs
      # docker/litellm/config.yaml for its model_list/aliases) is started as a
      # plain docker run with the repo checkout bind-mounted, instead.
      - name: Start LiteLLM proxy
        run: |
          docker run -d --name litellm \
            --network host \
            -v "${{ github.workspace }}/docker/litellm/config.yaml:/app/config.yaml" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e LITELLM_MASTER_KEY="sk-litellm-ci" \
            ghcr.io/berriai/litellm:main-latest \
            --config /app/config.yaml --port 4000
          timeout 60 bash -c 'until curl -sf http://localhost:4000/health/liveliness; do sleep 2; done'

      - name: Run ingestion
        run: uv run python -m rag.ingestion.pipeline

      - name: Run RAGAS eval suite
        env:
          EVAL_FAITHFULNESS_THRESHOLD: "0.85"
          EVAL_ANSWER_RELEVANCY_THRESHOLD: "0.85"
          EVAL_CONTEXT_PRECISION_THRESHOLD: "0.85"
          EVAL_REGRESSION_TOLERANCE: "0.02"
        run: uv run pytest -m integration tests/evals/test_golden_dataset.py -v

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/baseline_scores.json

      # _write_baseline_scores() (tests/evals/test_golden_dataset.py) only rewrites this
      # file locally in the runner's checkout, and only when every metric passed — see
      # ADR-001 addendum. Without this step that updated file never leaves the runner, so
      # `data/baseline_scores.json` on `main` would never actually advance after a passing
      # PR despite the ADR's "baseline only advances when a run passes" claim. Committing
      # back to the PR branch (not `main` directly) keeps the update visible in the PR diff
      # for review instead of silently mutating `main` out-of-band.
      - name: Commit updated baseline if it advanced
        if: always()
        run: |
          if ! git diff --quiet -- data/baseline_scores.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/baseline_scores.json
            git commit -m "chore: update eval baseline scores [skip ci]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No baseline change to commit."
          fi
