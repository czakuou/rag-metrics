name: Unit tests

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run type check
        run: uv run mypy src/

      - name: Run linter
        run: uv run ruff check src/ tests/

      # Tests that instantiate Settings use the `test_settings` fixture from
      # conftest.py, which provides fake values — no real secrets are needed here.
      # Integration tests (RAGAS, real LLM calls) are deselected and only run
      # in the eval gate on PRs to main.
      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "not integration"
